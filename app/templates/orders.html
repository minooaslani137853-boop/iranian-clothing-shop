{% extends 'base.html' %}{% block content %}<h1>تاریخچه سفارش‌ها</h1>{% for purchase in purchases %}<article><a href="{{ url_for('orders.confirmation', tracking_code=purchase.tracking_code) }}">{{ purchase.tracking_code }}</a><p>{{ '{:,}'.format(purchase.total_toman) }} تومان — {{ purchase.created_at }}</p></article>{% else %}<p>هنوز سفارشی ثبت نشده است.</p>{% endfor %}{% endblock %}
