<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}فروشگاه لباس ایرانی{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/shop.css') }}"></head>
<body><header><a href="{{ url_for('shop.products') }}">فروشگاه لباس ایرانی</a><nav aria-label="حساب کاربری">{% if g.user %}<span>{{ g.user.email }}</span><form method="post" action="{{ url_for('shop.logout') }}"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button>خروج</button></form>{% else %}<a href="{{ url_for('shop.login') }}">ورود</a> <a href="{{ url_for('shop.register') }}">ثبت‌نام</a>{% endif %}</nav></header><main>{% block content %}{% endblock %}</main></body></html>
